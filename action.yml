name: 'OpenHarness Doc Pipeline'
description: 'Auto generate system design docs from stories using OpenHarness'
inputs:
  api_key:
    description: 'LLM API Key'
    required: true
  base_url:
    description: 'LLM API Base URL'
    required: false
    default: 'https://api.jiekou.ai/openai/v1'
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - shell: bash
      run: pip install uv
      
    - shell: bash
      env:
        OPENHARNESS_API_KEY: ${{ inputs.api_key }}
        OPENAI_API_KEY: ${{ inputs.api_key }}
        OPENHARNESS_BASE_URL: ${{ inputs.base_url }}
        PYTHONIOENCODING: "utf-8"
        PYTHONUTF8: "1"
      run: |
        echo "🔄 强制同步工作区到最新状态..."
        cd ${{ github.workspace }}
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # 提取当前分支名
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        if [ -n "$BRANCH_NAME" ] && [ "$BRANCH_NAME" != "$GITHUB_REF" ]; then
          git fetch origin $BRANCH_NAME
          git checkout $BRANCH_NAME
          git pull --rebase origin $BRANCH_NAME || true
        fi
        
        echo "🚀 初始化 OpenHarness 引擎..."
        git clone https://github.com/HKUDS/OpenHarness.git /tmp/harness/OpenHarness
        
        echo "📥 拉取流水线脚本..."
        git clone https://github.com/Alex907795990/openharness-doc-pipeline.git /tmp/harness/pipeline-scripts
        
        echo "🔧 应用引擎热修复 (Hotfix)..."
        cp /tmp/harness/pipeline-scripts/patches/glob_tool.py /tmp/harness/OpenHarness/src/openharness/tools/glob_tool.py
        
        cd /tmp/harness/OpenHarness && uv sync
        export PATH="/tmp/harness/OpenHarness/.venv/bin:$PATH"
        
        cp -r /tmp/harness/pipeline-scripts/* /tmp/harness/
        chmod +x /tmp/harness/*.sh
        
        echo "⚙️ 执行文档生成..."
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          /tmp/harness/refresh_docs.sh ${{ github.workspace }}
        else
          /tmp/harness/update_docs.sh ${{ github.workspace }}
        fi

    - shell: bash
      run: |
        echo "💾 提交变更..."
        cd ${{ github.workspace }}
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add oh-gen-doc/ MEMORY.md 2>/dev/null || true
        if git diff --cached --quiet 2>/dev/null; then
          echo "✅ 文档无变化，无需提交"
        else
          git commit -m "docs: 🤖 自动更新系统设计文档 (由 OpenHarness 生成)"
          git push
          echo "✅ 成功推送文档变更"
        fi
